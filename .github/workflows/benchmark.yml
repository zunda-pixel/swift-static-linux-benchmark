name: benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: benchmark (oha measurements) or profile (perf stat / perf record per variant)
        type: choice
        options: [benchmark, profile]
        default: benchmark
      runner:
        description: Runner (x64 or ARM64)
        type: choice
        options: [ubuntu-26.04, ubuntu-26.04-arm]
        default: ubuntu-26.04
      cpu_configs:
        description: >-
          Server:client CPU lists, measured one after another in the same job (e.g. "0:1-3 0-1:2-3 0-2:3").
          Empty splits the CPUs in half. Profile mode uses the first one.
        default: ""
      variants:
        description: Variants to benchmark (space separated; also glibc-noble glibc-noble-2.39 glibc-noble-2.39-jemalloc musl-mallocng musl-sdk-fastmemcpy)
        default: glibc musl-sdk musl-mimalloc-v3
      endpoints:
        description: Endpoints to benchmark (space separated)
        default: plaintext json allocation parallel-allocation
      concurrencies:
        description: Concurrency levels (space separated)
        default: 1 10 25 50 100
      reps:
        description: Repetitions per condition
        default: "5"
      warmup:
        description: Warmup seconds per endpoint
        default: "10"
      duration:
        description: Seconds per measurement
        default: "30"
  pull_request:
  push:
    branches: [main]

# Pull request and push runs are grouped per event and ref: superseded pull request runs are
# cancelled, and pushes wait for the running one. Manually dispatched runs each get their own group
# (by run id): they run on separate VMs, and sharing a group would cancel all but the newest of the
# runs waiting in it.
concurrency:
  group: benchmark-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OHA_VERSION: v1.16.0

jobs:
  benchmark:
    # All variants are built and measured in this single job so they share one runner VM.
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-variants

      - name: Install oha
        run: |
          # Release assets are named after the Debian architecture (amd64, arm64).
          sudo curl -fsSL -o /usr/local/bin/oha "https://github.com/hatoo/oha/releases/download/${OHA_VERSION}/oha-linux-$(dpkg --print-architecture)"
          sudo chmod +x /usr/local/bin/oha
          oha --version

      - name: Verify binaries and allocators
        run: scripts/verify.sh

      - name: Collect environment
        run: python3 scripts/collect_env.py results bin

      - name: Benchmark
        if: inputs.mode != 'profile'
        env:
          # Pull requests and pushes run a short smoke benchmark; full runs are manual.
          VARIANTS: ${{ github.event_name == 'workflow_dispatch' && inputs.variants || 'glibc glibc-noble glibc-noble-2.39 glibc-noble-2.39-jemalloc musl-sdk musl-mimalloc-v3 musl-mallocng musl-sdk-fastmemcpy' }}
          ENDPOINTS: ${{ github.event_name == 'workflow_dispatch' && inputs.endpoints || 'plaintext json allocation parallel-allocation' }}
          CONCURRENCIES: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrencies || '1 50' }}
          REPS: ${{ github.event_name == 'workflow_dispatch' && inputs.reps || '1' }}
          WARMUP: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup || '1' }}
          DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.duration || '3' }}
          CPU_CONFIGS: ${{ inputs.cpu_configs }}
        run: |
          if [[ -z "$CPU_CONFIGS" ]]; then
            scripts/benchmark.sh
          else
            # Each server:client CPU split gets its own results directory.
            for config in $CPU_CONFIGS; do
              SERVER_CPUS=${config%%:*} CLIENT_CPUS=${config#*:} RESULTS_DIR="results/cpus-${config%%:*}" scripts/benchmark.sh
            done
          fi

      - name: Summarize
        if: always() && inputs.mode != 'profile'
        run: |
          if compgen -G "results/cpus-*" >/dev/null; then
            for dir in results/cpus-*; do
              cp results/environment.json "$dir/"
              echo "# Server CPUs ${dir#results/cpus-}" | tee -a "$GITHUB_STEP_SUMMARY"
              python3 scripts/summarize.py "$dir" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          else
            python3 scripts/summarize.py results | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install perf
        if: inputs.mode == 'profile'
        run: |
          sudo apt-get -q update
          sudo apt-get -q install -y linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get -q install -y linux-tools-common linux-tools-azure linux-tools-generic
          # Prefer the perf wrapper; if it cannot find tools for the running kernel, use a perf
          # binary from the installed linux-tools packages directly.
          if perf --version >/dev/null 2>&1; then
            perf_bin=$(command -v perf)
          else
            perf_bin=$(dpkg -L $(dpkg -l 'linux-*tools-*' | awk '/^ii/ { print $2 }') 2>/dev/null \
              | grep -E '/perf$' | while read -r f; do [[ -x "$f" && ! -d "$f" ]] && echo "$f"; done | sort -V | tail -n 1)
          fi
          if [[ -z "$perf_bin" ]]; then
            echo "perf not found; installed tools packages:" >&2
            dpkg -l 'linux-*tools-*' >&2 || true
            exit 1
          fi
          echo "PERF=$perf_bin" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          "$perf_bin" --version

      - name: Profile
        if: inputs.mode == 'profile'
        env:
          VARIANTS: ${{ inputs.variants }}
          ENDPOINTS: ${{ inputs.endpoints }}
          DURATION: ${{ inputs.duration }}
          CPU_CONFIGS: ${{ inputs.cpu_configs }}
        run: |
          if [[ -n "$CPU_CONFIGS" ]]; then
            first=${CPU_CONFIGS%% *}
            export SERVER_CPUS=${first%%:*} CLIENT_CPUS=${first#*:}
          fi
          scripts/profile.sh

      - name: Summarize profile
        if: always() && inputs.mode == 'profile'
        run: python3 scripts/summarize_profile.py results | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            bin/*/build-info.json
            bin/*/swift-version.txt
            bin/*/runtime-allocator.txt
