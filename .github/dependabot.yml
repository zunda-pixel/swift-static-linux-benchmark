version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Swift toolchain image. A toolchain bump also needs STATIC_SDK_URL / STATIC_SDK_CHECKSUM
  # in docker/Dockerfile updated by hand (the SDK must match the toolchain exactly).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ["*"]
